const buttons = document.querySelectorAll('.topics button');
const posts = document.querySelectorAll('article[data-topic]');
const empty = document.getElementById('empty');
for (const button of buttons) {
  button.addEventListener('click', () => {
    const topic = button.textContent;
    for (const option of buttons) option.setAttribute('aria-pressed', String(option === button));
    for (const post of posts) post.hidden = topic !== 'All' && post.dataset.topic !== topic;
    empty.hidden = Array.from(posts).some(post => !post.hidden);
    empty.textContent = empty.hidden ? '' : 'No posts in ' + topic + ' yet.';
  });
}
